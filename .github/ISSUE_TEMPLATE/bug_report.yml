name: Bug report
description: Something in Mochi doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        A security problem? Please don't report it here:
        [SECURITY.md](https://github.com/BlackMagicKau/mochi/security/policy) says how to report it
        privately. Setting Mochi up? The [troubleshooting guide](https://github.com/BlackMagicKau/mochi/blob/main/docs/TROUBLESHOOTING.md) has
        fixes for the common problems.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Mochi did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: mac
    attributes:
      label: Your Mac and its macOS
      placeholder: MacBook Air (M3), macOS 26.1
    validations:
      required: true
  - type: input
    id: mac-mochi
    attributes:
      label: Mochi for Mac's version
      description: The line at the foot of Mochi's Settings › General, such as "Mochi 0.5.1 (563)".
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your iPhone or iPad and its iOS or iPadOS
      placeholder: iPad mini (A17 Pro), iPadOS 26.1
    validations:
      required: true
  - type: input
    id: device-mochi
    attributes:
      label: The Mochi app's version
      description: >-
        Settings › General › iPhone Storage (or iPad Storage) › Mochi shows it. Mochi's log on your
        Mac names it too, on its "Client hello" line.
  - type: dropdown
    id: route
    attributes:
      label: How the device reached the Mac
      description: The word at the end of your Mac's row on the device.
      options:
        - Wi-Fi
        - Wired (USB cable)
        - Direct (Direct Wireless Connection)
        - Remote (Remote Access)
        - Not paired (it asked to pair)
        - Update Mochi
        - It didn't connect
        - I don't know
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Mochi's log on your Mac
      description: >-
        Optional. Show Log… in the Mochi menu, or ~/Library/Logs/Mochi/Mochi.log. Paste only the lines
        around the problem. The log names your windows, your devices and their network addresses,
        and this issue is public: take out what you don't want to share, or email the lines to
        support@example.invalid instead.
      render: text
